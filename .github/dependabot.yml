# Weekly dependency updates. Minor and patch updates are grouped into one PR per
# ecosystem; majors come as separate PRs.
version: 2
updates:
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
    groups:
      composer-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions-minor-patch:
        update-types: [minor, patch]

  # Base images in Dockerfile and docker/dev/app.Dockerfile.
  - package-ecosystem: docker
    directories: [/, /docker/dev]
    schedule:
      interval: weekly
    groups:
      docker-minor-patch:
        update-types: [minor, patch]

  # Service images (and the pinned MinIO digest) in compose.yaml and compose.prod.yaml.
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    groups:
      compose-minor-patch:
        update-types: [minor, patch]

  # Dev container features (.devcontainer/devcontainer-lock.json).
  - package-ecosystem: devcontainers
    directory: /
    schedule:
      interval: weekly
