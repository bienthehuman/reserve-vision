name: Tests (MySQL 8.4)

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    name: MySQL 8.4
    uses: ./.github/workflows/_tests.yml
    with:
      database-image: mysql:8.4
