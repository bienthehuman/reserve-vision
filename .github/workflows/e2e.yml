# Playwright + axe against the dev Compose stack, MySQL only (docs/CONVENTIONS.md).
name: E2E

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    name: Playwright + axe
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - name: Let the containers write to the checkout
        # The dev containers run as UID 1000 (compose.yaml); the runner user is 1001.
        # .env is created here so `key:generate` (in the container) can write it.
        run: |
          cp .env.example .env
          chmod -R a+rwX .

      - name: Start the dev stack (bin/setup)
        run: bin/setup

      - uses: actions/setup-node@v4
        with:
          node-version: '24.22'

      - name: Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium

      - name: Install Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Chromium system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Playwright + axe (phone-360, desktop-1280)
        run: npm run e2e

      - name: Upload the Playwright report and traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

      - name: Stack logs
        if: failure()
        run: docker compose logs --no-color --tail=200
