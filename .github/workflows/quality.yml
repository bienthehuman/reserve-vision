name: Quality

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  php:
    name: Pint + Larastan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql, intl, zip, bcmath, pcntl
          tools: composer:v2
          coverage: none

      - name: Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install PHP dependencies
        run: |
          composer install --no-interaction --prefer-dist --no-progress
          cp .env.example .env

      - name: Pint
        run: composer lint

      - name: Larastan
        run: composer analyse -- --error-format=github

  frontend:
    name: TypeScript + Vitest + build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: '24.22'
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci --no-audit --no-fund

      - name: TypeScript
        run: npm run types

      - name: Vitest
        run: npm run test

      - name: Production build (client + SSR)
        run: npm run build

      - name: CSS budget (35 KB gzipped)
        run: node bin/check-css-budget.mjs
