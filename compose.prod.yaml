# Production stack for a single Docker host (DEPLOY.md, ADR 0007).
#
#   docker compose -f compose.prod.yaml --env-file .env.production up -d --wait
#
# deploy.sh runs the full sequence (build, migrate as migrator, up, optimize,
# app:doctor, /up). Every secret comes from .env.production (git-ignored; see
# .env.production.example). The production CI workflow boots this same file.
name: reservevision-prod

x-app: &app
  build:
    context: .
    dockerfile: Dockerfile
  image: reservevision:${IMAGE_TAG:-latest}
  env_file:
    - path: .env.production
  restart: unless-stopped
  depends_on:
    db:
      condition: service_healthy
    minio-setup:
      condition: service_completed_successfully

services:
  caddy:
    image: caddy:2.11-alpine
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env.production}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL in .env.production}
      AWS_PHOTOS_BUCKET: ${AWS_PHOTOS_BUCKET:?Set AWS_PHOTOS_BUCKET in .env.production}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

  app:
    <<: *app
    # Healthcheck (GET /up) comes from the Dockerfile.
    depends_on:
      db:
        condition: service_healthy
      minio-setup:
        condition: service_completed_successfully
      ssr:
        condition: service_healthy

  ssr:
    image: reservevision:${IMAGE_TAG:-latest}
    # The self-contained SSR bundle (Dockerfile, assets stage); needs no secrets.
    command: ["node", "bootstrap/ssr/app.js"]
    init: true
    environment:
      NODE_ENV: production
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:13714/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  worker:
    <<: *app
    # --max-time: restart hourly so a leak can't grow forever; restart policy brings it back.
    command: ["php", "artisan", "queue:work", "--tries=3", "--sleep=3", "--max-time=3600"]
    healthcheck:
      # Not the image's web check: this service runs artisan, not the web server.
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 10s
      timeout: 3s
      retries: 3

  scheduler:
    <<: *app
    command: ["php", "artisan", "schedule:work"]
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"] # see worker
      interval: 10s
      timeout: 3s
      retries: 3

  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env.production}
      RV_DB_DATABASE: ${DB_DATABASE:?Set DB_DATABASE in .env.production}
      RV_DB_APP_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env.production}
      RV_DB_MIGRATOR_PASSWORD: ${DB_MIGRATOR_PASSWORD:?Set DB_MIGRATOR_PASSWORD in .env.production}
      # No RV_DB_TEST_DATABASE: production gets only the app schema.
    volumes:
      - db-data:/var/lib/mysql
      # The same init script and SQL as dev and CI (ADR 0008).
      - ./docker/mysql/initdb.d:/docker-entrypoint-initdb.d:ro
      - ./database/sql/create-users.sql:/rv-sql/create-users.sql:ro
    healthcheck:
      # TCP as `app`: "healthy" means the init script has created the users.
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u app -p\"$$RV_DB_APP_PASSWORD\" --silent"]
      interval: 3s
      timeout: 3s
      retries: 40
      start_period: 10s
    restart: unless-stopped

  minio:
    # MinIO no longer publishes images on Docker Hub or Quay; Chainguard builds it
    # from source. The -dev variant includes sh, wget and mc (healthcheck, setup).
    image: cgr.dev/chainguard/minio:latest-dev@sha256:64f223d68a772fc3e77412176417e5b8a00bb9d25ba465ae53d951e283c736ab
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env.production}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env.production}
      MINIO_BROWSER: "off"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  # One-shot: creates both buckets and the app's own MinIO user, then exits 0.
  # Idempotent; runs on every `up`.
  minio-setup:
    image: cgr.dev/chainguard/minio:latest-dev@sha256:64f223d68a772fc3e77412176417e5b8a00bb9d25ba465ae53d951e283c736ab
    entrypoint: ["/bin/sh", "/setup/setup.sh"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:?Set AWS_ACCESS_KEY_ID in .env.production}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:?Set AWS_SECRET_ACCESS_KEY in .env.production}
      AWS_PHOTOS_BUCKET: ${AWS_PHOTOS_BUCKET}
      AWS_PROOFS_BUCKET: ${AWS_PROOFS_BUCKET:?Set AWS_PROOFS_BUCKET in .env.production}
      HOME: /tmp
    volumes:
      - ./docker/minio/setup.sh:/setup/setup.sh:ro
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"

volumes:
  db-data:
  minio-data:
  caddy-data:
  caddy-config:
