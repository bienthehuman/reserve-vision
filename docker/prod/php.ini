; Production overrides on top of php.ini-production (Dockerfile, runtime stage).
memory_limit = 256M
upload_max_filesize = 12M
post_max_size = 14M
expose_php = Off
max_execution_time = 30

; OPcache: the code never changes inside a running container, so timestamps
; are never checked. A new release is a new image and a new container.
opcache.enable = 1
opcache.enable_cli = 0
opcache.validate_timestamps = 0
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.save_comments = 1
opcache.jit = tracing
opcache.jit_buffer_size = 64M

realpath_cache_size = 4096K
realpath_cache_ttl = 600
